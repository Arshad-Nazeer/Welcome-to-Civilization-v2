# ============================================================
#  Model Configurations
# ============================================================

tfidf_lr:
  model_id: 1_tfidf_lr
  description: "Word + Char TF-IDF with Logistic Regression per label"
  input_col: text_clean
  seed: 42
  vectorizer_word:
    ngram_range: [1, 2]
    lowercase: true
    min_df: 3
    max_features: 50000
    sublinear_tf: true
    dtype: float32
  vectorizer_char:
    analyzer: char_wb
    ngram_range: [2, 5]
    lowercase: false
    min_df: 3
    max_features: 100000
    sublinear_tf: true
    dtype: float32
  classifier:
    penalty: l2
    solver: liblinear
    C: 2.0
    max_iter: 200
    random_state: 42
    n_jobs: 6
  tune:
    C: [2.0]
  imbalance:
    method: sqrt_neg_pos_ratio
    negative_weight: 1.0

bigru_attn:
  model_id: 2_bigru_attn
  description: "BiGRU with Additive Attention and Frozen fastText"
  input_col: text_clean
  seed: 42
  tokenizer:
    regex: "\\w+|[^\\w\\s]"
    lowercase: true
    max_len: 256
    truncation: head
  vocab:
    max_vocab: 50000
    min_freq: 2
    pad_token: "<pad>"
    unk_token: "<unk>"
    pad_idx: 0
    unk_idx: 1
  embedding:
    source: "crawl-300d-2M.vec.zip"
    url: "https://dl.fbaipublicfiles.com/fasttext/vectors-english/crawl-300d-2M.vec.zip"
    dim: 300
    frozen: true
    spatial_dropout: 0.25
  encoder:
    type: gru
    bidirectional: true
    num_layers: 1
    hidden_dim: 128
    output_dropout: 0.3
  attention:
    type: additive
    dim: 128
  head:
    num_classes: 6
  imbalance:
    method: sqrt_neg_pos_ratio
    bias_init: log_odds
  training:
    optimizer: adamw
    lr: 0.001
    weight_decay: 0.01
    batch_size: 128
    eval_batch_size: 1024
    grad_clip: 1.0
    epochs: 6
    patience: 2
    monitor_metric: val_macro_pr_auc
    mixed_precision: true

