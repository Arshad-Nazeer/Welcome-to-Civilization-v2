# ============================================================
#  Model Configurations
# ============================================================

tfidf_lr:
  model_id: 1_tfidf_lr
  description: "Word + Char TF-IDF with Logistic Regression per label"
  input_col: text_clean
  seed: 42
  vectorizer_word:
    ngram_range: [1, 2]
    lowercase: true
    min_df: 3
    max_features: 50000
    sublinear_tf: true
    dtype: float32
  vectorizer_char:
    analyzer: char_wb
    ngram_range: [2, 5]
    lowercase: false
    min_df: 3
    max_features: 100000
    sublinear_tf: true
    dtype: float32
  classifier:
    penalty: l2
    solver: liblinear
    C: 2.0
    max_iter: 200
    random_state: 42
    n_jobs: 6
  tune:
    C: [2.0]
  imbalance:
    method: sqrt_neg_pos_ratio
    negative_weight: 1.0
